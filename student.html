<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c70f2">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>html{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>원더스피크 레벨테스트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: one infinite "map" (Prezi-style). Frames sit on it in rings around two hub circles; the camera zooms out-and-in between them. Single deliberate look: WonderSpeak blue world, white frames, peach hubs. */
:root{
  --blue:#0c70f2; --deep:#0a3c8f; --ink:#0e1b33; --paper:#ffffff; --peach:#ffae6a; --peach-deep:#f2802f;
  --sky:#e8f1ff; --muted:#5b6a85; --line:#d6e2f5;
  --f-en:"Bricolage Grotesque","Sora",system-ui,sans-serif;
  --f-ko:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--blue);color:var(--paper);font-family:var(--f-ko);overflow:hidden;position:relative}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--peach);outline-offset:3px}

#stage{position:absolute;inset:0;overflow:hidden;background:
  radial-gradient(circle at 20% 15%,rgba(255,255,255,.10),transparent 40%),
  radial-gradient(circle at 85% 90%,rgba(10,60,143,.55),transparent 55%),var(--blue)}
#stage::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.16) 1.2px,transparent 1.3px);background-size:26px 26px;pointer-events:none}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#paths{position:absolute;overflow:visible;pointer-events:none}

.fr{position:absolute;background:var(--paper);color:var(--ink);border-radius:56px;padding:80px 90px;display:flex;flex-direction:column;box-shadow:0 40px 120px rgba(6,30,80,.35);transition:opacity .5s}
.fr.circle{border-radius:50%;align-items:center;justify-content:center;text-align:center;padding:160px}
.fr.hub{background:var(--peach);color:var(--ink)}
.fr.navy{background:var(--deep);color:var(--paper)}
body:not(.ov) .fr:not(.cur){opacity:.55}
body:not(.ov) .fr:not(.cur) *{pointer-events:none}
body.ov .fr{cursor:pointer}
body.ov .fr *{pointer-events:none}
body.ov .fr:hover{box-shadow:0 0 0 24px rgba(255,174,106,.9),0 40px 120px rgba(6,30,80,.35)}

.fr.on .pop{animation:pop .7s cubic-bezier(.2,.9,.3,1.25) both}
.fr.on .pop:nth-child(2){animation-delay:.08s}.fr.on .pop:nth-child(3){animation-delay:.16s}.fr.on .pop:nth-child(4){animation-delay:.24s}.fr.on .pop:nth-child(5){animation-delay:.32s}
@keyframes pop{from{opacity:0;transform:translateY(40px) scale(.96)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fr.on .pop{animation:none}#world{transition:none!important}}

.eyebrow{font-family:var(--f-en);font-weight:700;font-size:34px;letter-spacing:.14em;text-transform:uppercase;color:var(--blue)}
.hub .eyebrow,.navy .eyebrow{color:var(--ink);opacity:.7}
.navy .eyebrow{color:var(--peach);opacity:1}
.en{font-family:var(--f-en)}
.mega{font-family:var(--f-en);font-weight:800;font-size:250px;line-height:.86;letter-spacing:-.04em;margin:0}
.mega em{font-style:normal;color:var(--blue)}
.hub .mega em{color:var(--paper)}
.h1{font-family:var(--f-en);font-weight:800;font-size:120px;line-height:.95;letter-spacing:-.03em;margin:0}
.ko-h{font-weight:700;font-size:64px;line-height:1.25;margin:0;text-wrap:balance}
.ko-b{font-size:40px;line-height:1.5;margin:0;color:var(--muted);text-wrap:balance}
.hub .ko-b{color:var(--ink);opacity:.75}

/* title */
.title .badge{font-family:var(--f-en);font-weight:700;font-size:40px;background:var(--blue);color:var(--paper);border-radius:999px;padding:14px 40px;letter-spacing:.06em}
.title .mega{font-size:230px;margin-top:40px}
.title .ko-b{margin-top:50px;font-size:46px}
.start{margin-top:60px;border:0;background:var(--ink);color:var(--paper);font-weight:700;font-size:42px;padding:26px 64px;border-radius:999px;cursor:pointer}

/* flow */
.flow{display:grid;grid-template-columns:repeat(4,1fr);gap:28px;margin-top:70px;position:relative}
.flow .st{border-radius:36px;background:var(--sky);padding:40px 34px;display:flex;flex-direction:column;gap:14px;min-height:340px}
.flow .st:nth-child(odd){background:#fff1e4}
.flow .n{font-family:var(--f-en);font-weight:800;font-size:90px;color:var(--blue);line-height:1}
.flow .st:nth-child(odd) .n{color:var(--peach-deep)}
.flow b{font-size:46px}
.flow span{font-size:30px;color:var(--muted);line-height:1.45}

/* evaluation map */
.groups{display:grid;grid-template-columns:1fr 1.25fr 1.9fr .9fr;gap:24px;margin-top:56px}
.grp{border-radius:32px;border:4px solid var(--line);padding:30px;display:flex;flex-direction:column;gap:16px}
.grp h4{margin:0;font-family:var(--f-en);font-size:32px;font-weight:700;color:var(--blue);line-height:1.15}
.grp .tags{display:flex;flex-wrap:wrap;gap:10px}
.grp .tag{font-size:28px;background:var(--sky);border-radius:999px;padding:8px 22px;font-weight:600}
.grp:nth-child(3){border-color:var(--peach)}
.grp:nth-child(3) h4{color:var(--peach-deep)}
.grp:nth-child(3) .tag{background:#fff1e4}
.scale5{display:flex;align-items:center;gap:22px;margin-top:44px;font-size:32px;color:var(--muted)}
.scale5 i{font-style:normal;font-family:var(--f-en);font-weight:800;width:68px;height:68px;border-radius:50%;display:grid;place-items:center;background:var(--sky);color:var(--blue);font-size:34px}
.scale5 i:last-of-type{background:var(--peach);color:var(--ink)}

/* hubs */
.hub .mega{font-size:210px}
.hub .ko-h{margin-top:40px;font-size:60px}
.hub .ko-b{margin-top:24px}
.hub .pill{margin-top:50px;font-size:34px;font-weight:700;background:var(--ink);color:var(--paper);border-radius:999px;padding:16px 44px}

/* speaking stage frames */
.sp{padding:70px 84px}
.sp .top{display:flex;align-items:center;gap:30px}
.sp .no{width:120px;height:120px;border-radius:50%;background:var(--peach);display:grid;place-items:center;font-family:var(--f-en);font-weight:800;font-size:64px;flex:none}
.sp .nm{display:flex;flex-direction:column}
.sp .nm b{font-size:52px;line-height:1.2}
.sp .nm span{font-family:var(--f-en);font-weight:700;font-size:28px;letter-spacing:.12em;text-transform:uppercase;color:var(--blue)}
.sp .lvl{margin-left:auto;display:flex;gap:8px;background:var(--sky);padding:8px;border-radius:999px}
.sp .lvl button{border:0;background:transparent;border-radius:999px;padding:0 22px;height:56px;min-width:84px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;opacity:.45}
.sp .lvl button[aria-pressed="true"]{background:var(--paper);opacity:1;box-shadow:0 2px 8px rgba(14,27,51,.12)}
.sp .lvl i{width:16px;height:16px;border-radius:50%;display:block}
.sp .lvl i.d1{background:#9cc6ff}.sp .lvl i.d2{background:#4b95ff}.sp .lvl i.d3{background:var(--blue)}
.sp .q{flex:1;display:flex;align-items:center}
.sp .q p{margin:0;font-family:var(--f-en);font-weight:700;font-size:96px;line-height:1.08;letter-spacing:-.02em;text-wrap:balance}
.sp .bot{display:flex;align-items:center;justify-content:space-between;gap:30px}
.sp .cheer{font-size:34px;color:var(--muted)}
.qnav{display:flex;align-items:center;gap:18px;font-family:var(--f-en);font-weight:700;font-size:32px;color:var(--muted)}
.qnav button{width:84px;height:84px;border-radius:50%;border:4px solid var(--line);background:var(--paper);cursor:pointer;font-size:38px;color:var(--ink)}
.qnav button:disabled{opacity:.3;cursor:default}

/* picture talk */
.picrow{flex:1;display:grid;grid-template-columns:1.55fr 1fr;gap:56px;align-items:center;margin-top:34px;min-height:0}
.art{margin:0;border-radius:36px;overflow:hidden;box-shadow:0 0 0 6px var(--sky);aspect-ratio:12/7;background:var(--sky)}
.art svg{display:block;width:100%;height:100%}
.side{display:flex;flex-direction:column;gap:34px}
.pq{margin:0;font-family:var(--f-en);font-weight:700;font-size:72px;line-height:1.1;letter-spacing:-.02em;text-wrap:balance}

/* stress + liaison */
.words{display:grid;grid-template-columns:1fr 1fr;gap:26px 50px;margin-top:40px;flex:1;align-content:center}
.word{display:flex;align-items:center;gap:20px}
.word .tag{font-size:24px;color:var(--muted);width:90px;flex:none}
.syl{display:flex;gap:10px;align-items:center}
.syl span{font-family:var(--f-en);font-weight:600;font-size:46px;padding:10px 20px;border-radius:22px;background:var(--sky);transition:transform .45s cubic-bezier(.2,.9,.3,1.5),background .3s,color .3s}
.show .syl span.s{background:var(--peach);transform:scale(1.28) translateY(-6px);font-weight:800;margin-inline:10px}
.reveal{border:0;background:var(--ink);color:var(--paper);font-size:34px;font-weight:700;padding:20px 48px;border-radius:999px;cursor:pointer}
.show .reveal{background:var(--blue)}
.lines{display:flex;flex-direction:column;gap:12px;margin-top:24px;flex:1;justify-content:center}
.ln{display:grid;grid-template-columns:1.1fr 1fr;gap:30px;align-items:end;border-bottom:3px solid var(--sky);padding:22px 0 10px}
.ln .s{font-family:var(--f-en);font-weight:700;font-size:46px;letter-spacing:-.01em}
.ln .s u{text-decoration:none;position:relative}
.ln .s u::after{content:"";position:absolute;left:-14px;right:-14px;top:-24px;height:26px;border:5px solid var(--peach-deep);border-bottom:0;border-radius:40px 40px 0 0;opacity:0;transform:scaleY(.2);transform-origin:bottom;transition:opacity .4s,transform .5s cubic-bezier(.2,.9,.3,1.4)}
.show .ln .s u::after{opacity:1;transform:none}
.ln .sl{font-family:var(--f-en);font-weight:800;font-size:42px;color:var(--peach-deep);opacity:0;transform:translateX(-20px);transition:opacity .4s .15s,transform .5s .15s}
.show .ln .sl{opacity:1;transform:none}
.ln .sl small{display:block;font-family:var(--f-ko);font-weight:500;font-size:22px;color:var(--muted)}

/* end */
.end .mega{font-size:240px}
.end .ko-h{margin-top:40px}
.end .acts{display:flex;gap:24px;margin-top:60px}
.end .acts button{border:0;border-radius:999px;padding:24px 50px;font-size:34px;font-weight:700;cursor:pointer;background:var(--ink);color:var(--paper)}
.end .acts button.ghost{background:transparent;border:4px solid var(--ink);color:var(--ink)}
.end .acts button.warn{background:#c8372d;color:#fff;border-color:#c8372d}
.burst{position:absolute;inset:0;pointer-events:none;border-radius:50%;overflow:hidden}
.burst i{position:absolute;width:60px;height:60px;border-radius:50%;opacity:0}
.fr.on .burst i{animation:burst 1.4s cubic-bezier(.2,.8,.3,1) both}
@keyframes burst{0%{opacity:0;transform:translate(0,0) scale(.2)}20%{opacity:1}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(1)}}

/* chrome */
.brand{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:max(18px,env(safe-area-inset-left,0px));font-family:var(--f-en);font-weight:800;font-size:18px;letter-spacing:.02em;z-index:3;display:flex;gap:8px;align-items:center}
.brand span{font-weight:500;opacity:.75}
.bar{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:3;display:flex;align-items:center;gap:6px;background:rgba(10,30,70,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:6px;border-radius:999px;max-width:calc(100% - 32px)}
.bar button{border:0;background:transparent;color:#fff;border-radius:999px;height:40px;min-width:40px;padding:0 14px;cursor:pointer;font-size:14px;font-weight:600;white-space:nowrap}
.bar button:hover{background:rgba(255,255,255,.14)}
.bar button.main{background:var(--paper);color:var(--ink)}
.bar .cnt{font-family:var(--f-en);font-weight:700;font-size:14px;padding:0 10px;font-variant-numeric:tabular-nums;white-space:nowrap}
.bar svg{width:18px;height:18px;display:block}
@media (max-width:520px){.bar .lbl{display:none}}
</style>
</head>
<body>
<div id="stage"><div id="world"><svg id="paths"></svg></div></div>
<div class="brand">WONDER SPEAK <span>Level Test</span></div>
<div class="bar" role="toolbar" aria-label="화면 이동">
  <button id="b-prev" aria-label="이전"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
  <span class="cnt" id="cnt">1 / 1</span>
  <button id="b-ov" aria-label="전체 보기"><span class="lbl">전체 보기</span></button>
  <button id="b-fs" aria-label="전체 화면"><span class="lbl">전체 화면</span></button>
  <button id="b-next" class="main" aria-label="다음"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
</div>

<script>
/* WonderSpeak picture-description scenes: original flat illustrations, built as SVG strings. */
const WS_SCENES = (() => {
  const SKIN = ['#f2c7a5', '#e0a982', '#c98e66', '#f6d3b8'];
  const INK = '#22304a';
  function person(o) {
    const { x, y, pose = 'stand', dir = 1, skin = SKIN[0], hair = '#2b2b2b', top = '#0c70f2', bottom = '#26324a', s = 1, hand = '', mouth = 'smile', tilt = 0, long = false, held = '' } = o;
    const g = [];
    const shoe = '#1b2335';
    const face = (hx, hy) => {
      const ex = hx + dir * 9;
      let m = '';
      if (mouth === 'smile') m = `<path d="M${ex - 7} ${hy + 9} q7 6 14 0" stroke="${INK}" stroke-width="2.6" fill="none" stroke-linecap="round"/>`;
      if (mouth === 'open') m = `<ellipse cx="${ex}" cy="${hy + 11}" rx="6" ry="5" fill="${INK}"/>`;
      if (mouth === 'sad') m = `<path d="M${ex - 6} ${hy + 13} q6 -6 12 0" stroke="${INK}" stroke-width="2.6" fill="none" stroke-linecap="round"/>`;
      if (mouth === 'flat') m = `<path d="M${ex - 5} ${hy + 11} h10" stroke="${INK}" stroke-width="2.6" stroke-linecap="round"/>`;
      const eyes = mouth === 'sleep'
        ? `<path d="M${ex - 9} ${hy - 2} q4 3 8 0 M${ex + 3} ${hy - 2} q4 3 8 0" stroke="${INK}" stroke-width="2.4" fill="none" stroke-linecap="round"/>`
        : `<circle cx="${ex - 5}" cy="${hy - 2}" r="3" fill="${INK}"/><circle cx="${ex + 7}" cy="${hy - 2}" r="3" fill="${INK}"/>`;
      const hairBack = long ? `<path d="M${hx - 27} ${hy - 4} q-4 34 6 44 h42 q10 -10 6 -44 z" fill="${hair}"/>` : '';
      return `<g transform="rotate(${tilt} ${hx} ${hy + 20})">${hairBack}<circle cx="${hx}" cy="${hy}" r="27" fill="${skin}"/>
        <path d="M${hx - 28} ${hy - 2} a28 28 0 0 1 56 0 q-10 -12 -28 -12 q-18 0 -28 12z" fill="${hair}"/>${eyes}${m}</g>`;
    };
    if (pose === 'stand' || pose === 'run') {
      const hipY = y - 95, shY = y - 178;
      if (pose === 'stand') {
        g.push(`<rect x="${x - 24}" y="${hipY}" width="20" height="92" rx="9" fill="${bottom}"/><rect x="${x + 4}" y="${hipY}" width="20" height="92" rx="9" fill="${bottom}"/>`);
        g.push(`<ellipse cx="${x - 14 + dir * 4}" cy="${y - 2}" rx="15" ry="7" fill="${shoe}"/><ellipse cx="${x + 14 + dir * 4}" cy="${y - 2}" rx="15" ry="7" fill="${shoe}"/>`);
      } else {
        g.push(`<g transform="rotate(${-34 * dir} ${x} ${hipY + 6})"><rect x="${x - 10}" y="${hipY}" width="20" height="92" rx="9" fill="${bottom}"/><ellipse cx="${x + dir * 6}" cy="${hipY + 90}" rx="15" ry="7" fill="${shoe}"/></g>`);
        g.push(`<g transform="rotate(${30 * dir} ${x} ${hipY + 6})"><rect x="${x - 10}" y="${hipY}" width="20" height="92" rx="9" fill="${bottom}"/><ellipse cx="${x + dir * 6}" cy="${hipY + 90}" rx="15" ry="7" fill="${shoe}"/></g>`);
      }
      const arm = (ax, rot) => `<g transform="rotate(${rot} ${ax + 7} ${shY + 10})"><rect x="${ax}" y="${shY + 4}" width="15" height="78" rx="7" fill="${top}"/><circle cx="${ax + 7.5}" cy="${shY + 84}" r="9" fill="${skin}"/></g>`;
      const back = pose === 'run' ? 40 * dir : (hand === 'phone' ? 0 : 6 * dir);
      g.push(arm(x - 7 - dir * 26, back));
      g.push(`<rect x="${x - 31}" y="${shY}" width="62" height="96" rx="24" fill="${top}"/>`);
      if (hand === 'phone') {
        g.push(`<g transform="rotate(${-150 * dir} ${x + dir * 22} ${shY + 12})"><rect x="${x + dir * 22 - 7}" y="${shY + 6}" width="15" height="62" rx="7" fill="${top}"/><circle cx="${x + dir * 22}" cy="${shY + 70}" r="9" fill="${skin}"/></g>`);
        g.push(`<rect x="${x + dir * 30 - 5}" y="${shY - 52}" width="11" height="22" rx="3" fill="${INK}"/>`);
      } else {
        const front = pose === 'run' ? -50 * dir : (hand === 'reach' ? -70 * dir : (hand === 'hold' ? -60 * dir : -6 * dir));
        g.push(arm(x - 7 + dir * 26, front));
      }
      g.push(face(x, shY - 30));
    } else if (pose === 'sit' || pose === 'sleep') {
      const seat = y, shY = seat - 98;
      g.push(`<rect x="${dir > 0 ? x - 14 : x - 62}" y="${seat - 22}" width="76" height="22" rx="10" fill="${bottom}"/>`);
      const kneeX = x + dir * 50;
      g.push(`<rect x="${kneeX - 10}" y="${seat - 20}" width="20" height="70" rx="9" fill="${bottom}"/><ellipse cx="${kneeX + dir * 6}" cy="${seat + 50}" rx="15" ry="7" fill="${shoe}"/>`);
      g.push(`<rect x="${x - 31}" y="${shY}" width="62" height="96" rx="24" fill="${top}"/>`);
      if (pose === 'sleep') {
        g.push(`<rect x="${x - 6}" y="${shY + 30}" width="15" height="60" rx="7" fill="${top}" transform="rotate(${-30 * dir} ${x} ${shY + 30})"/>`);
      } else {
        const ang = hand === 'up' ? -95 * dir : -62 * dir;
        g.push(`<g transform="rotate(${ang} ${x + dir * 14} ${shY + 16})"><rect x="${x + dir * 14 - 7}" y="${shY + 10}" width="15" height="64" rx="7" fill="${top}"/><circle cx="${x + dir * 14}" cy="${shY + 76}" r="9" fill="${skin}"/></g>`);
      }
      g.push(face(x + dir * 2, shY - 30));
    }
    g.push(held);
    return `<g transform="translate(${x} ${y}) scale(${s}) translate(${-x} ${-y})">${g.join('')}</g>`;
  }
  const plant = (x, y, s = 1) => `<g transform="translate(${x} ${y}) scale(${s})"><ellipse cx="-22" cy="-80" rx="16" ry="40" fill="#3f9a6b" transform="rotate(-25 -22 -80)"/><ellipse cx="22" cy="-82" rx="16" ry="40" fill="#2f845b" transform="rotate(25 22 -82)"/><ellipse cx="0" cy="-98" rx="16" ry="44" fill="#4fb07c"/><path d="M-34 -40 h68 l-8 40 h-52z" fill="#e2733a"/></g>`;
  const cup = (x, y, c = '#ffffff') => `<g><rect x="${x - 11}" y="${y - 22}" width="22" height="22" rx="4" fill="${c}" stroke="${INK}" stroke-width="2.5"/><path d="M${x + 11} ${y - 16} q10 0 10 7 q0 7 -10 7" stroke="${INK}" stroke-width="2.5" fill="none"/><path d="M${x - 4} ${y - 30} q4 -6 0 -12 M${x + 4} ${y - 30} q4 -6 0 -12" stroke="#9aa8c2" stroke-width="2.2" fill="none" stroke-linecap="round"/></g>`;
  const text = (x, y, t, size, fill, weight = 700, anchor = 'start') => `<text x="${x}" y="${y}" font-family="Bricolage Grotesque,Sora,system-ui,sans-serif" font-size="${size}" font-weight="${weight}" fill="${fill}" text-anchor="${anchor}">${t}</text>`;

  /* ---------- 1. living room (basic) ---------- */
  const living = `
  <rect width="1200" height="700" fill="#e8f1ff"/>
  <rect y="520" width="1200" height="180" fill="#d8b98f"/>
  ${Array.from({ length: 6 }, (_, i) => `<path d="M0 ${545 + i * 28} H1200" stroke="#c9a77a" stroke-width="3"/>`).join('')}
  <ellipse cx="610" cy="615" rx="330" ry="58" fill="#ffae6a"/>
  <ellipse cx="610" cy="615" rx="270" ry="42" fill="none" stroke="#f2802f" stroke-width="5" stroke-dasharray="14 12"/>
  <rect x="90" y="95" width="270" height="230" rx="10" fill="#ffffff"/>

  <div class="top pop"><span class="no">5</span><div class="nm"><span>Read aloud · Stress</span><b>단어 강세</b></div><button class="reveal" style="margin-left:auto" data-rev="stress">${S.rev.stress?'다시 읽기':'강세 보기'}</button></div>
  <div class="words pop">${WORDS.map(([w,sy,s,tag])=>`<div class="word"><span class="tag">${tag||''}</span><span class="syl">${sy.map((x,i)=>`<span class="${i===s?'s':''}">${esc(x)}</span>`).join('')}</span></div>`).join('')}</div>
  <div class="bot pop"><span class="cheer">먼저 읽어 보고, 강세를 확인한 뒤 다시 읽어 보세요.</span></div>`});}
{const [x,y]=ring(HUB2[0],HUB2[1],2650,NSP,STAGES.length+1);
add({id:'liaison',cx:x,cy:y,w:1500,h:860,cls:'sp rd',html:()=>`
  <div class="top pop"><span class="no">6</span><div class="nm"><span>Read aloud · Linking</span><b>연음 · 이어서 들리는 소리</b></div><button class="reveal" style="margin-left:auto" data-rev="liaison">${S.rev.liaison?'다시 읽기':'들리는 소리 보기'}</button></div>
  <div class="lines pop">${LINKS.map(([s,sl])=>`<div class="ln"><span class="s">${s}</span><span class="sl">${esc(sl)}</span></div>`).join('')}</div>`});}
add({id:'end',cx:HUB2[0],cy:4300,w:1800,h:1800,cls:'circle hub end',html:()=>`
  <div class="burst">${Array.from({length:14},(_,k)=>{const a=k/14*Math.PI*2,r=620+(k%3)*90;return `<i style="left:50%;top:50%;margin:-30px;background:${k%2?'#0c70f2':'#ffffff'};--x:${Math.cos(a)*r}px;--y:${Math.sin(a)*r}px;animation-delay:${(k%4)*.06}s"></i>`;}).join('')}</div>
  <span class="eyebrow pop">All done</span>
  <h2 class="mega pop">Great<br><em>job!</em></h2>
  <p class="ko-h pop">수고하셨어요</p>
  <p class="ko-b pop">결과지는 선생님이 바로 출력해 드려요.</p>
  <div class="acts pop"><button class="ghost" data-act="home">처음으로</button><button id="b-reset" data-act="reset">다음 학생 준비</button></div>`});

/* ---------- build ---------- */
const world=document.getElementById('world'),svg=document.getElementById('paths');
let minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9;
F.forEach(f=>{minX=Math.min(minX,f.cx-f.w/2);minY=Math.min(minY,f.cy-f.h/2);maxX=Math.max(maxX,f.cx+f.w/2);maxY=Math.max(maxY,f.cy+f.h/2);});
const ALL={cx:(minX+maxX)/2,cy:(minY+maxY)/2,w:maxX-minX,h:maxY-minY};
const pad=600;
svg.setAttribute('width',ALL.w+pad*2);svg.setAttribute('height',ALL.h+pad*2);
svg.style.left=(minX-pad)+'px';svg.style.top=(minY-pad)+'px';
const ox=x=>x-minX+pad,oy=y=>y-minY+pad;
let paths=`<circle cx="${ox(HUB2[0])}" cy="${oy(HUB2[1])}" r="2650" fill="none" stroke="rgba(255,255,255,.22)" stroke-width="10" stroke-dasharray="4 34" stroke-linecap="round"/>`;
for(let k=0;k<F.length-1;k++){const a=F[k],b=F[k+1];if(a.st!==undefined&&(b.st!==undefined||b.id==='stress'))continue;if(a.id==='stress')continue;
  paths+=`<line x1="${ox(a.cx)}" y1="${oy(a.cy)}" x2="${ox(b.cx)}" y2="${oy(b.cy)}" stroke="rgba(255,255,255,.28)" stroke-width="12" stroke-dasharray="2 40" stroke-linecap="round"/>`;}
svg.innerHTML=paths;
F.forEach((f,k)=>{const el=document.createElement('section');el.className='fr '+(f.cls||'');el.id='f-'+f.id;el.dataset.k=k;
  el.style.left=(f.cx-f.w/2)+'px';el.style.top=(f.cy-f.h/2)+'px';el.style.width=f.w+'px';el.style.height=f.h+'px';
  el.setAttribute('aria-label',`${k+1}번 화면`);world.appendChild(el);f.el=el;});
const paint=k=>{F[k].el.innerHTML=F[k].html();};
F.forEach((_,k)=>paint(k));

/* ---------- camera ---------- */
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let ov=false,cur=null,timer=null;
function viewFor(b){const vw=innerWidth,vh=innerHeight-70;const s=Math.min(vw*.94/b.w,vh*.92/b.h);return {s,tx:vw/2-b.cx*s,ty:vh/2+8-b.cy*s};}
function apply(v,ms){world.style.transition=ms&&!reduce?`transform ${ms}ms cubic-bezier(.65,0,.25,1)`:'none';world.style.transform=`translate(${v.tx}px,${v.ty}px) scale(${v.s})`;cur=v;}
function union(a,b){const x1=Math.min(a.cx-a.w/2,b.cx-b.w/2),y1=Math.min(a.cy-a.h/2,b.cy-b.h/2),x2=Math.max(a.cx+a.w/2,b.cx+b.w/2),y2=Math.max(a.cy+a.h/2,b.cy+b.h/2);return {cx:(x1+x2)/2,cy:(y1+y2)/2,w:(x2-x1)*1.15,h:(y2-y1)*1.15};}
function mark(){F.forEach((f,k)=>{f.el.classList.toggle('cur',k===S.i&&!ov);f.el.classList.remove('on');});
  document.getElementById('cnt').textContent=`${S.i+1} / ${F.length}`;document.body.classList.toggle('ov',ov);
  document.getElementById('b-ov').querySelector('.lbl').textContent=ov?'돌아가기':'전체 보기';}
function arrive(){if(ov)return;paint(S.i);void F[S.i].el.offsetWidth;F[S.i].el.classList.add('on');}
function go(k,instant){
  const from=F[S.i];S.i=Math.max(0,Math.min(F.length-1,k));save();ov=false;mark();clearTimeout(timer);
  const to=F[S.i],target=viewFor(to);
  if(instant||!cur||reduce){apply(target,0);arrive();return;}
  const d=Math.hypot(to.cx-from.cx,to.cy-from.cy);
  if(from!==to&&d>Math.max(to.w,from.w)*1.6){apply(viewFor(union(from,to)),700);timer=setTimeout(()=>{apply(target,850);timer=setTimeout(arrive,800);},720);}
  else{apply(target,950);timer=setTimeout(arrive,700);}
}
function overview(){clearTimeout(timer);ov=!ov;mark();if(ov)apply(viewFor(ALL),1100);else go(S.i);}

/* ---------- input ---------- */
document.getElementById('b-prev').onclick=()=>go(S.i-1);
document.getElementById('b-next').onclick=()=>go(S.i+1);
document.getElementById('b-ov').onclick=overview;
document.getElementById('b-fs').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch(_){}};
addEventListener('keydown',e=>{if(e.target.closest&&e.target.closest('input,textarea'))return;
  if(e.key==='ArrowRight'||e.key==='PageDown'||(e.key===' '&&!e.target.closest('button'))){e.preventDefault();go(S.i+1);}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(S.i-1);}
  else if(e.key==='o'||e.key==='O'||e.key==='Escape'){if(e.key!=='Escape'||ov)overview();}});
let resetArmed=false;
world.addEventListener('click',e=>{
  if(ov){const fr=e.target.closest('.fr');if(fr)go(+fr.dataset.k);return;}
  const b=e.target.closest('button');if(!b)return;const d=b.dataset;
  if(d.act==='next')go(S.i+1);
  else if(d.act==='home')go(0);
  else if(d.act==='reset'){if(!resetArmed){resetArmed=true;b.textContent='응답 지우고 처음으로';b.classList.add('warn');setTimeout(()=>{resetArmed=false;const r=document.getElementById('b-reset');if(r){r.textContent='다음 학생 준비';r.classList.remove('warn');}},4000);return;}
    resetArmed=false;S={i:0,lv:{},qi:{},rev:{}};save();F.forEach((_,k)=>paint(k));go(0);}
  else if(d.lv!==undefined){S.lv[d.lv]=d.v;S.qi[d.lv]=0;save();paint(S.i);}
  else if(d.qn!==undefined){S.qi[d.qn]=(S.qi[d.qn]||0)+(+d.d);save();paint(S.i);}
  else if(d.rev!==undefined){S.rev[d.rev]=!S.rev[d.rev];save();F[S.i].el.classList.toggle('show',S.rev[d.rev]);b.textContent=S.rev[d.rev]?'다시 읽기':(d.rev==='stress'?'강세 보기':'들리는 소리 보기');}
});
// keep reveal state in the class (paint() rebuilds inner HTML only)
['stress','liaison'].forEach(id=>{const f=F.find(x=>x.id===id);if(S.rev[id])f.el.classList.add('show');});
// swipe on touch screens
let sx=null;document.getElementById('stage').addEventListener('touchstart',e=>{sx=e.touches[0].clientX;},{passive:true});
document.getElementById('stage').addEventListener('touchend',e=>{if(sx==null)return;const dx=e.changedTouches[0].clientX-sx;sx=null;if(Math.abs(dx)>70&&!e.target.closest('button'))go(S.i+(dx<0?1:-1));},{passive:true});
addEventListener('resize',()=>apply(ov?viewFor(ALL):viewFor(F[S.i]),0));

go(S.i,true);
})();
</script>
</body>
</html>
